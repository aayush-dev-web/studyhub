<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications — StudyHub</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('studyhub_theme'); } catch (e) {}
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = saved || (light ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard-v2.css" />
  <style>
    body.dash2 { min-height: 100vh; padding: 1.6rem; }
    .page-wrap { max-width: 640px; margin: 0 auto; }
    .page-top { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem; }
    .page-top a { color: var(--text-dim); display: inline-flex; }
    .page-top a svg { width: 20px; height: 20px; }
    .page-top h1 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; }
    .notif-row { display: flex; gap: 0.8rem; padding: 0.9rem 0; border-bottom: 1px solid var(--line); }
    .notif-row:last-child { border-bottom: 0; }
    .notif-row__icon { width: 36px; height: 36px; border-radius: 50%; background: var(--ink-800); color: var(--blue-soft); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .notif-row__icon svg { width: 17px; height: 17px; }
    .notif-row__body { flex: 1; }
    .notif-row__title { font-size: 0.88rem; color: var(--text); }
    .notif-row__time { font-size: 0.75rem; color: var(--text-faint); margin-top: 0.15rem; }
    .notif-row.is-unread { background: var(--ink-800); border-radius: var(--r-md); padding-left: 0.6rem; padding-right: 0.6rem; }
  </style>
</head>
<body class="dash2">
  <div class="page-wrap">
    <div class="page-top">
      <a href="dashboard.html" id="back-link" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></a>
      <h1>Notifications</h1>
    </div>
    <section class="panel2">
      <div id="notif-list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function timeAgo(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return "Just now";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      if (s < 86400) return Math.floor(s / 3600) + "h ago";
      return Math.floor(s / 86400) + "d ago";
    }
    (async () => {
      const session = await requireAuth();
      if (!session) return;

      const { data: profile } = await supabase.from("profiles").select("role").eq("user_id", session.user.id).maybeSingle();
      document.getElementById("back-link").href = homeForRole(profile?.role);

      const list = document.getElementById("notif-list");
      try {
        const { data, error } = await supabase
          .from("notifications")
          .select("id, title, body, is_read, created_at")
          .eq("user_id", session.user.id)
          .order("created_at", { ascending: false })
          .limit(50);
        if (error) throw error;
        if (!data || !data.length) {
          list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><p>No notifications yet.</p></div>`;
          return;
        }
        list.innerHTML = data.map((n) => `
          <div class="notif-row ${n.is_read ? "" : "is-unread"}">
            <span class="notif-row__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span>
            <div class="notif-row__body">
              <div class="notif-row__title">${escapeHtml(n.title || n.body || "Notification")}</div>
              <div class="notif-row__time">${timeAgo(n.created_at)}</div>
            </div>
          </div>`).join("");

        await supabase.from("notifications").update({ is_read: true }).eq("user_id", session.user.id).eq("is_read", false);
      } catch (err) {
        if (isMissingTable(err)) {
          list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><p>No notifications yet.</p></div>`;
        } else {
          list.innerHTML = `<div class="empty-state"><p>Couldn't load notifications right now.</p></div>`;
        }
      }
    })();
  </script>
</body>
</html>
