<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map — StudyHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    .map-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; height: calc(100vh - 62px - 2.8rem); }
    #full-map { border-radius: var(--r-lg); overflow: hidden; }
    .map-sidebar { overflow-y: auto; }
    .list-row { display: flex; gap: 0.7rem; align-items: center; padding: 0.65rem 0.6rem; border-radius: 10px; cursor: pointer; }
    .list-row:hover { background: #f4f5f9; }
    .list-row__icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
    .list-row__icon svg { width: 17px; height: 17px; }
    .list-row__title { font-size: 0.9rem; font-weight: 500; color: var(--ink); }
    .list-row__meta { font-size: 0.78rem; color: var(--ink-dim); text-transform: capitalize; }
    .filter-bar { display: flex; gap: 0.7rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-bar__search { position: relative; flex: 1; min-width: 220px; }
    .filter-bar__search svg { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-faint); }
    .filter-bar__search input { width: 100%; padding: 0.6rem 0.8rem 0.6rem 2.2rem; border: 1px solid var(--surface-line-strong); border-radius: 10px; font: inherit; }
    #type-filter { padding: 0.6rem 0.9rem; border: 1px solid var(--surface-line-strong); border-radius: 10px; font: inherit; background: #fff; }
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; padding: 2rem 1rem; text-align: center; color: var(--ink-dim); }
    .empty-state svg { width: 30px; height: 30px; opacity: 0.5; }
    @media (max-width: 860px) { .map-layout { grid-template-columns: 1fr; height: auto; } #full-map { height: 340px; } }
  </style>
</head>
<body class="dashboard">

  <!-- ============================================================ TOPBAR -->
  <header class="topbar" id="topbar">
    <a href="dashboard.html" class="topbar__brand">
      <img src="/assets/studyhub-logo.png" alt="StudyHub" class="topbar__brand-logo">
      StudyHub
    </a>

    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <nav class="topbar__nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="/library/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/></svg>
        Learn
      </a>
      <a href="/library/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 6l4-1 1 15-4 1z"/></svg>
        Library
      </a>
      <a href="/community/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 19c0-3 3-5.2 6.5-5.2s6.5 2.2 6.5 5.2"/><circle cx="17.5" cy="8.5" r="2.3"/><path d="M15.8 13.9c2.6.3 4.7 2.2 4.7 4.6"/></svg>
        Community
      </a>
      <a href="ai-teacher.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><rect x="7" y="7" width="10" height="10" rx="3"/></svg>
        AI Teacher
      </a>
      <a href="/community/#/members">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Teachers
      </a>
      <a href="map.html" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3Z"/><path d="M9 7v13M15 4v13"/></svg>
        Map
      </a>
      <a href="/community/#/calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Calendar
      </a>
    </nav>

    <div class="topbar__right">
      <div class="profile-menu" id="profile-menu">
        <button type="button" class="profile-trigger" id="profile-trigger">
          <span class="avatar avatar--sm" data-avatar>S</span>
          <img class="avatar avatar--sm" data-avatar-img hidden alt="" />
          <svg class="profile-trigger__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="profile-dropdown">
          <div class="profile-dropdown__head">
            <span class="avatar avatar--md" data-avatar>S</span>
            <img class="avatar avatar--md" data-avatar-img hidden alt="" />
            <div>
              <div class="profile-dropdown__name"><span data-identity-name>—</span></div>
              <div class="profile-dropdown__meta" data-identity-meta>—</div>
            </div>
          </div>
          <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>My Profile</a>
          <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
          <div class="profile-dropdown__divider"></div>
          <button type="button" class="is-danger" onclick="studyHubSignOut()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================================================== MAIN -->
  <main class="dash-main" style="max-width: 1300px; padding-top: 1.6rem;">
    <div class="section-head" style="margin-bottom: 1rem;">
      <h2 style="font-size: 1.4rem;">Educational Map</h2>
    </div>
    <p style="color: var(--ink-dim); margin: -0.6rem 0 1.2rem; font-size: 0.92rem;">Find schools, colleges, universities and libraries near you.</p>

    <div class="filter-bar">
      <div class="filter-bar__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-box" type="search" placeholder="Search by name or city…" />
      </div>
      <select id="type-filter">
        <option value="">All types</option>
        <option value="school">Schools</option>
        <option value="college">Colleges</option>
        <option value="university">Universities</option>
      </select>
    </div>

    <div class="map-layout">
      <div class="panel map-sidebar" id="places-list"></div>
      <div id="full-map"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard-nav.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
