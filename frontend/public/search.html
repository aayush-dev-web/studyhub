<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search — StudyHub</title>
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('studyhub_theme'); } catch (e) {}
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = saved || (light ? 'light' : 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/dashboard-v2.css" />
  <style>
    body.dash2 { min-height: 100vh; padding: 1.6rem; }
    .page-wrap { max-width: 760px; margin: 0 auto; }
    .page-top { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem; }
    .page-top a { color: var(--text-dim); display: inline-flex; }
    .page-top a svg { width: 20px; height: 20px; }
    .search-box { display: flex; align-items: center; gap: 0.6rem; background: var(--ink-800); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0.7rem 1rem; margin-bottom: 1.2rem; }
    .search-box svg { width: 18px; height: 18px; color: var(--text-faint); flex-shrink: 0; }
    .search-box input { flex: 1; border: 0; background: none; outline: none; font: inherit; color: var(--text); font-size: 0.95rem; }
    .result-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 0; border-bottom: 1px solid var(--line); }
    .result-row:last-child { border-bottom: 0; }
    .result-row__cover { width: 42px; height: 56px; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; }
    .result-row__body { flex: 1; min-width: 0; }
    .result-row__title { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .result-row__meta { font-size: 0.78rem; color: var(--text-faint); }
  </style>
</head>
<body class="dash2">
  <div class="page-wrap">
    <div class="page-top">
      <a href="dashboard.html" id="back-link" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></a>
      <h1 style="font-family:var(--font-display);font-size:1.3rem;margin:0;">Search</h1>
    </div>
    <form class="search-box" id="search-form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search the library by title or author…" />
    </form>
    <section class="panel2">
      <div class="panel2__head"><h2 id="result-count">Library</h2></div>
      <div id="results"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let allBooks = [];

    function escapeHtml(str = "") {
      return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render(q) {
      const term = q.trim().toLowerCase();
      const matches = term
        ? allBooks.filter((b) => b.title.toLowerCase().includes(term) || (b.author || "").toLowerCase().includes(term) || (b.category || "").toLowerCase().includes(term))
        : allBooks.slice(0, 20);

      document.getElementById("result-count").textContent = term ? `${matches.length} result${matches.length === 1 ? "" : "s"} for "${q}"` : "Browse the Library";

      const results = document.getElementById("results");
      if (!matches.length) {
        results.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><p>No matches. Try a different search.</p></div>`;
        return;
      }
      results.innerHTML = matches
        .map(
          (b) => `
        <a class="result-row" href="/library/book.html?id=${encodeURIComponent(b.id)}">
          <div class="result-row__cover" style="background-image:url('/library/${b.cover}')"></div>
          <div class="result-row__body">
            <div class="result-row__title">${escapeHtml(b.title)}</div>
            <div class="result-row__meta">${escapeHtml(b.author || "")}${b.category ? " · " + escapeHtml(b.category) : ""}</div>
          </div>
        </a>`
        )
        .join("");
    }

    (async () => {
      const session = await requireAuth();
      if (!session) return;
      const { data: profile } = await supabase.from("profiles").select("role").eq("user_id", session.user.id).maybeSingle();
      document.getElementById("back-link").href = homeForRole(profile?.role);

      const initialQ = new URLSearchParams(location.search).get("q") || "";
      document.getElementById("q").value = initialQ;

      try {
        const res = await fetch("/library/api/books");
        const data = await res.json();
        allBooks = data.books || [];
      } catch (err) {
        console.debug("[StudyHub] search: library fetch failed", err);
      }
      render(initialQ);

      document.getElementById("search-form").addEventListener("submit", (e) => {
        e.preventDefault();
        render(document.getElementById("q").value);
      });
      document.getElementById("q").addEventListener("input", (e) => render(e.target.value));
    })();
  </script>
</body>
</html>
